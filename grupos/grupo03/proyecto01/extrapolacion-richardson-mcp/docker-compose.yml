services:
  grupo03_proyecto01_extrapolacion-richardson-mcp:
    build: .
    container_name: ${LAB_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "8000"
    environment:
      LAB_IMG_BUCKET: ${LAB_IMG_BUCKET}
      LAB_PUBLIC_IMG_URL: ${LAB_PUBLIC_IMG_URL}

networks:
  default:
    name: lab_net
    external: true
