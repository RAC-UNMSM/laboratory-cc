services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -s3 -s3.port=8333 -volume.max=50 -master.volumeSizeLimitMB=256"
    volumes:
      - seaweed_datos:/data
    networks: [lab_net]

  caddy:
    image: caddy:2
    ports:
      - "8080:8080"
    volumes:
      - ./despliegue/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [seaweedfs, grupo06-frenet-lagrange]
    networks: [lab_net]

  grupo06-frenet-lagrange:
    build: .
    container_name: grupo06-frenet-lagrange
    init: true
    mem_limit: 512m
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_HTTP_PATH: /mcp
      MCP_STATELESS: "1"
      MCP_MATH_STORAGE: s3
      MCP_GRUPO: grupo06
      SEAWEEDFS_S3_URL: http://seaweedfs:8333
      IMG_BUCKET: grupo06-frenet-lagrange-imgs
      PUBLIC_IMG_BASE_URL: http://localhost:8080/img/grupo06-frenet-lagrange
      MCP_MATH_PROCESOS: "1"
      MCP_MATH_WORKERS: "1"
      MCP_MATH_TIMEOUT: "120"
      MCP_MATH_LOG: INFO
      MCP_MATH_RESULTADOS: /tmp/resultados
      MCP_URL: http://0.0.0.0:8000/mcp
      PUBLIC_LOCAL_BASE_URL: http://localhost:8080/img/grupo06-frenet-lagrange
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_REGION: us-east-1
      S3_TIMEOUT: "20"
      AGENTE_PROVEEDOR: simulado
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    depends_on: [seaweedfs]
    networks: [lab_net]

volumes:
  seaweed_datos:

networks:
  lab_net:
    name: lab_net
