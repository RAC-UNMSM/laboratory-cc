# grupo06-frenet-lagrange — despliegue en el entorno del laboratorio.
#
# La red Docker externa «lab_net» ya existe y en ella corren SeaweedFS (DNS: seaweedfs,
# API S3 en :8333) y Caddy. El despliegue calcula el nombre del contenedor desde la ruta
# de la carpeta y lo inyecta en ${LAB_CONTAINER_NAME}; Caddy lo encuentra por esa red.
#
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#
# Para probar TODO en tu PC (SeaweedFS + Caddy + este servidor): docker-compose.local.yml
services:
  grupo06-frenet-lagrange:
    build: .
    container_name: ${LAB_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: 512m
    init: true                                   # recoge los procesos de cálculo que se terminan
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_HTTP_PATH: /mcp
      MCP_STATELESS: "1"                         # sin sesiones en memoria: escalable a varias réplicas
      MCP_GRUPO: grupo06
      SEAWEEDFS_S3_URL: http://seaweedfs:8333
      IMG_BUCKET: grupo06-frenet-lagrange-imgs
      PUBLIC_IMG_BASE_URL: https://rac-unmsm.vekthos.org/img/grupo06-frenet-lagrange
      MCP_MATH_PROCESOS: "1"                     # cálculos en procesos aparte (con límite de tiempo)
      MCP_MATH_WORKERS: "2"                      # cálculos simultáneos por contenedor
      MCP_MATH_TIMEOUT: "120"
      MCP_MATH_LOG: INFO
      # Solo si SeaweedFS exige credenciales S3:
      # S3_ACCESS_KEY: ...
      # S3_SECRET_KEY: ...
    expose:
      - "8000"                                   # visible para Caddy dentro de lab_net; no se publica al host

networks:
  default:
    name: lab_net
    external: true
