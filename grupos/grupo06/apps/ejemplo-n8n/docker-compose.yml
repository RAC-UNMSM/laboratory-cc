# Copiar esta carpeta como punto de partida para desplegar una app open
# source cualquiera (n8n es solo el ejemplo del piloto, sección 2 del plan).
# Ver grupos/TEMPLATE/README.md para las reglas obligatorias.

services:
  ejemplo-n8n:
    image: n8nio/n8n:latest
    container_name: lab-gNN-ejemplo-n8n # <- reemplazar gNN por el número real del grupo
    restart: unless-stopped
    mem_limit: 512m
    environment:
      N8N_PATH: /gNN/ejemplo-n8n/
      WEBHOOK_URL: https://${LAB_DOMAIN:-localhost}/gNN/ejemplo-n8n/
      GENERIC_TIMEZONE: America/Lima
    volumes:
      - ejemplo_n8n_data:/home/node/.n8n

networks:
  default:
    name: lab_net
    external: true

volumes:
  ejemplo_n8n_data:
    name: lab-gNN-ejemplo-n8n_data
