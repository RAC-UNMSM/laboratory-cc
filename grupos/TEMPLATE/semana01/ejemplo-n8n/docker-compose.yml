# Copiar esta carpeta como punto de partida para desplegar una app open
# source cualquiera (n8n es solo el ejemplo del piloto, sección 2 del plan).
# Ver grupos/TEMPLATE/README.md para las reglas obligatorias.
#
# container_name, la ruta pública y el nombre del volumen son automáticos
# (los calcula el propio despliegue a partir de la ubicación real de esta
# carpeta) — no hace falta tocarlos ni reemplazar nada acá.

services:
  ejemplo-n8n:
    image: n8nio/n8n:latest
    container_name: ${LAB_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      N8N_PATH: ${LAB_PUBLIC_PATH}/
      WEBHOOK_URL: https://${LAB_DOMAIN:-localhost}${LAB_PUBLIC_PATH}/
      GENERIC_TIMEZONE: America/Lima
    volumes:
      - ejemplo_n8n_data:/home/node/.n8n

networks:
  default:
    name: lab_net
    external: true

volumes:
  ejemplo_n8n_data:
    name: ${LAB_CONTAINER_NAME}_data
