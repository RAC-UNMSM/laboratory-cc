services:
  mcp-test:
    build: .
    container_name: ${LAB_CONTAINER_NAME:-lab-grupo04_proyecto01_mcp-test}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MCP_REPORTS_DIR: /app/reports
      MCP_PUBLIC_BASE_URL: "${MCP_PUBLIC_BASE_URL:-https://wiadeuserrant.win}"
    volumes:
      - reports_data:/app/reports
    ports:
      - "8000:8000"

volumes:
  reports_data:

networks:
  default:
    name: lab_net
    external: true
