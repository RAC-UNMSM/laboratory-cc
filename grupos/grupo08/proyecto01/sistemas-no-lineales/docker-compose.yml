services:
  sistemas-no-lineales:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${LAB_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: 512m
    # El servidor MCP escucha por HTTP (streamable-http) en el puerto 8000.
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      LAB_IMG_BUCKET: ${LAB_IMG_BUCKET}
      LAB_PUBLIC_IMG_URL: ${LAB_PUBLIC_IMG_URL}
    expose:
      - "8000"
    # Solo se escribe en /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: lab_net
    external: true
