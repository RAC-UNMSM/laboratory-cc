name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-resource-limits:
    name: Validar límites de recursos y privilegios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --no-cache-dir PyYAML

      - name: Validar docker-compose.yml de cada grupo/app
        run: python3 ci/validate_resource_limits.py

  dev-run:
    name: Dev-run efímero (build + up + logs + down)
    needs: validate-resource-limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 2 commits: el merge del PR y su padre (main), para saber qué
          # carpetas toca este PR (git diff HEAD^1 HEAD).
          fetch-depth: 2

      - name: Crear red externa lab_net (la esperan los compose de grupo)
        run: docker network create lab_net

      - name: Levantar cada app de grupo, comprobar que funciona, y bajarla
        id: devrun
        run: |
          set +e
          SUMMARY_FILE="$RUNNER_TEMP/devrun_summary.md"
          TABLA="$RUNNER_TEMP/devrun_tabla.md"
          DETALLE="$RUNNER_TEMP/devrun_detalle.md"
          SALIDA="$RUNNER_TEMP/devrun_app_salida.txt"
          LOGS="$RUNNER_TEMP/devrun_app_logs.txt"
          : > "$DETALLE"
          { echo "| App | Resultado |"; echo "|---|---|"; } > "$TABLA"
          OVERALL_STATUS=0

          # Carpetas que toca este PR: sus apps van primero y con el log completo;
          # el resto solo se resume, para que el comentario no se corte (GitHub
          # limita un comentario a 65 536 caracteres).
          CAMBIADOS=$(git diff --name-only HEAD^1 HEAD 2>/dev/null)

          # _referencia: 2 niveles (apps/<app>). Grupos de alumnos: 3 niveles
          # (<semana>/<tema>) -- el identificador de app pasa a ser
          # "<grupo>_<semana>_<tema>" completo, igual que en lab_deploy/apps.py
          # del repo de infraestructura.
          # sort -u: _referencia/apps/<app>/docker-compose.yml calza con los
          # dos patrones del glob (es, de casualidad, también 3 niveles) y
          # quedaría procesado dos veces si no se deduplica.
          mapfile -t todos < <(printf '%s\n' grupos/_referencia/apps/*/docker-compose.yml grupos/*/*/*/docker-compose.yml | sort -u)
          del_pr=(); resto=()
          for f in "${todos[@]}"; do
            [ -e "$f" ] || continue
            if grep -q "^$(dirname "$f")/" <<<"$CAMBIADOS"; then del_pr+=("$f"); else resto+=("$f"); fi
          done
          compose_files=("${del_pr[@]}" "${resto[@]}")

          contenedores() { docker ps -aq --filter "label=com.docker.compose.project=$project"; }
          todos_en() {
            # 0 si hay al menos un contenedor y todos están en el estado $1.
            local ids id
            ids=$(contenedores)
            [ -n "$ids" ] || return 1
            for id in $ids; do
              [ "$(docker inspect -f '{{.State.Status}}' "$id")" = "$1" ] || return 1
            done
          }
          estados() {
            contenedores | xargs -r docker inspect -f '{{.Name}}={{.State.Status}} (código {{.State.ExitCode}})' | tr '\n' ' '
          }

          for compose_file in "${compose_files[@]}"; do
            dir=$(dirname "$compose_file")
            if [[ "$compose_file" == grupos/_referencia/apps/* ]]; then
              group="_referencia"
              app=$(basename "$dir")
            else
              group=$(basename "$(dirname "$(dirname "$dir")")")
              # _referencia ya se procesó arriba (glob específico) y TEMPLATE
              # es solo la plantilla de referencia, no un grupo real: ninguno
              # de los dos se despliega acá.
              if [[ "$group" == "_referencia" || "$group" == "TEMPLATE" ]]; then
                continue
              fi
              semana=$(basename "$(dirname "$dir")")
              tema=$(basename "$dir")
              app="${group}_${semana}_${tema}"
            fi
            project="ci-${group}-${app}"

            # Mismo cálculo que lab_deploy/naming.py del repo de
            # infraestructura: el nombre del
            # contenedor y la ruta pública nunca se escriben a mano en el
            # docker-compose.yml del grupo, se inyectan acá.
            if [[ "$group" == "_referencia" ]]; then
              container_name="lab-referencia-${app}"
              public_path="/mcp/${app}"
            else
              container_name="lab-${app}"
              public_path="/${group}/${app}"
            fi

            tocada=no
            if grep -q "^${dir}/" <<<"$CAMBIADOS"; then tocada=si; fi

            echo "--- Dev-run: ${group}/${app} (de este PR: ${tocada}) ---"

            (
              cd "$dir"
              MCP_GITHUB_TOKEN="${MCP_GITHUB_TOKEN:-dummy-ci-token}" \
              LAB_DOMAIN="ci.localhost" \
              LAB_CONTAINER_NAME="$container_name" \
              LAB_PUBLIC_PATH="$public_path" \
                docker compose -p "$project" up -d --build --quiet-pull 2>&1
            ) > "$SALIDA" 2>&1
            up_status=$?

            # Misma comprobación que el despliegue real (lab_deploy/deployer.py):
            # que `docker compose up` no falle NO basta. Un servicio debe quedar
            # corriendo; un script de una sola corrida (restart: "no") debe
            # terminar con código 0.
            fallo=""
            detalle_ok="quedó corriendo"
            if [ $up_status -ne 0 ]; then
              fallo="\`docker compose up\` falló (código $up_status)"
            elif grep -Eq '^\s*restart:\s*"?no"?\s*$' "$compose_file" \
                 && ! grep -Eq '^\s*restart:\s*"?(always|unless-stopped|on-failure)' "$compose_file"; then
              for _ in $(seq 1 20); do todos_en exited && break; sleep 3; done
              if ! todos_en exited; then
                fallo="es de una sola corrida (\`restart: \"no\"\`) y no terminó en 60 s: $(estados)"
              elif contenedores | xargs -r docker inspect -f '{{.State.ExitCode}}' | grep -qv '^0$'; then
                fallo="terminó con error: $(estados)"
              else
                detalle_ok="corrió y terminó bien"
              fi
            else
              sleep 8
              if todos_en running; then sleep 5; fi
              if ! todos_en running; then
                fallo="el contenedor no quedó corriendo: $(estados)"
              elif [[ "$group" != "_referencia" && -f "$dir/server.py" ]]; then
                # Servidor MCP propio: tiene que responder en el puerto 8000,
                # ruta /mcp (transporte streamable-http), que es a donde apunta
                # el reverse proxy del servidor.
                cid=$(docker ps -q --filter "label=com.docker.compose.project=$project" | head -1)
                ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$cid" | awk '{print $1}')
                code=000
                for _ in $(seq 1 10); do
                  code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -X POST "http://${ip}:8000/mcp" \
                    -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                    -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
                  [ "$code" != "000" ] && break
                  sleep 3
                done
                if [ "$code" = "000" ]; then
                  fallo="el servidor MCP no responde en el puerto 8000. Debe arrancar con \`mcp.run(transport=\"streamable-http\", host=\"0.0.0.0\", port=8000)\`"
                elif [ "$code" = "404" ]; then
                  fallo="el servidor responde pero no tiene la ruta \`/mcp\` (HTTP 404): no está en \`streamable-http\`. Revisa el \`CMD\` del Dockerfile (debe ser \`python server.py\`) y que no use \`sse\`"
                else
                  detalle_ok="quedó corriendo y el MCP responde en \`/mcp\` (HTTP $code)"
                fi
              fi
            fi

            contenedores | xargs -r -n1 docker logs --tail 80 > "$LOGS" 2>&1
            (cd "$dir" && docker compose -p "$project" down -v --remove-orphans) > /dev/null 2>&1

            if [ -n "$fallo" ]; then
              OVERALL_STATUS=1
              echo "| \`${group}/${app}\` | ❌ **FALLÓ**: ${fallo} |" >> "$TABLA"
            else
              echo "| \`${group}/${app}\` | ✅ ${detalle_ok} |" >> "$TABLA"
            fi

            # Log completo solo para lo que toca este PR o lo que falló.
            if [ "$tocada" = "si" ] || [ -n "$fallo" ]; then
              lineas_build=120; lineas_logs=80; abierto=" open"
            else
              lineas_build=0; lineas_logs=12; abierto=""
            fi
            {
              echo ""
              echo "<details${abierto}><summary><b>${group}/${app}</b></summary>"
              echo ""
              if [ "$lineas_build" -gt 0 ]; then
                echo "Construcción y arranque (últimas ${lineas_build} líneas):"
                echo '```'
                tail -n "$lineas_build" "$SALIDA" | cut -c1-300
                echo '```'
              fi
              echo "Logs del contenedor:"
              echo '```'
              tail -n "$lineas_logs" "$LOGS" | cut -c1-300
              echo '```'
              echo "</details>"
            } >> "$DETALLE"
          done

          {
            echo "### Dev-run efímero — resultado por app"
            echo ""
            if [ $OVERALL_STATUS -ne 0 ]; then
              echo "**Hay apps que no arrancan bien.** No se puede fusionar hasta corregirlas."
            else
              echo "Todas las apps construyen, arrancan y quedan funcionando."
            fi
            echo ""
            cat "$TABLA"
            cat "$DETALLE"
          } > "$SUMMARY_FILE"

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"
          exit $OVERALL_STATUS

      - name: Publicar log en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = "${{ steps.devrun.outputs.summary_file }}";
            let body = "No se generó resumen del dev-run.";
            if (path && fs.existsSync(path)) {
              body = fs.readFileSync(path, "utf8");
              if (body.length > 60000) {
                body = body.slice(0, 60000) + "\n\n...(truncado)";
              }
            }
            const marker = "<!-- dev-run-efimero -->";
            body = marker + "\n" + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
