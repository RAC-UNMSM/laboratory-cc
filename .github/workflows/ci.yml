name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-resource-limits:
    name: Validar límites de recursos y privilegios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --no-cache-dir PyYAML

      - name: Validar docker-compose.yml de cada grupo/app
        run: python3 ci/validate_resource_limits.py

  dev-run:
    name: Dev-run efímero (build + up + logs + down)
    needs: validate-resource-limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear red externa lab_net (la esperan los compose de grupo)
        run: docker network create lab_net

      - name: Levantar cada app de grupo, capturar logs, y bajarla
        id: devrun
        run: |
          set +e
          SUMMARY_FILE="$RUNNER_TEMP/devrun_summary.md"
          echo "### Dev-run efímero — resultado por app" > "$SUMMARY_FILE"
          OVERALL_STATUS=0

          # _referencia: 2 niveles (apps/<app>). Grupos de alumnos: 3 niveles
          # (<semana>/<tema>) -- el identificador de app pasa a ser
          # "<grupo>_<semana>_<tema>" completo, igual que en discover_apps()
          # del repo de infraestructura.
          # sort -u: _referencia/apps/<app>/docker-compose.yml calza con los
          # dos patrones del glob (es, de casualidad, también 3 niveles) y
          # quedaría procesado dos veces si no se deduplica.
          mapfile -t compose_files < <(printf '%s\n' grupos/_referencia/apps/*/docker-compose.yml grupos/*/*/*/docker-compose.yml | sort -u)
          for compose_file in "${compose_files[@]}"; do
            [ -e "$compose_file" ] || continue
            dir=$(dirname "$compose_file")
            if [[ "$compose_file" == grupos/_referencia/apps/* ]]; then
              group="_referencia"
              app=$(basename "$dir")
            else
              group=$(basename "$(dirname "$(dirname "$dir")")")
              # _referencia ya se procesó arriba (glob específico) y TEMPLATE
              # es solo la plantilla de referencia, no un grupo real: ninguno
              # de los dos se despliega acá.
              if [[ "$group" == "_referencia" || "$group" == "TEMPLATE" ]]; then
                continue
              fi
              semana=$(basename "$(dirname "$dir")")
              tema=$(basename "$dir")
              app="${group}_${semana}_${tema}"
            fi
            project="ci-${group}-${app}"

            # Mismo cálculo que lab_pipelines (docker_resource.py /
            # app_deploy.py) del repo de infraestructura: el nombre del
            # contenedor y la ruta pública nunca se escriben a mano en el
            # docker-compose.yml del grupo, se inyectan acá.
            if [[ "$group" == "_referencia" ]]; then
              container_name="lab-referencia-${app}"
              public_path="/mcp/${app}"
            else
              container_name="lab-${app}"
              public_path="/${group}/${app}"
            fi

            echo "--- Dev-run: ${group}/${app} ---"
            echo "" >> "$SUMMARY_FILE"
            echo "<details><summary><b>${group}/${app}</b></summary>" >> "$SUMMARY_FILE"
            echo '' >> "$SUMMARY_FILE"
            echo '```' >> "$SUMMARY_FILE"

            (
              cd "$dir"
              MCP_GITHUB_TOKEN="${MCP_GITHUB_TOKEN:-dummy-ci-token}" \
              LAB_DOMAIN="ci.localhost" \
              LAB_CONTAINER_NAME="$container_name" \
              LAB_PUBLIC_PATH="$public_path" \
                docker compose -p "$project" up -d --build --quiet-pull 2>&1
            ) >> "$SUMMARY_FILE" 2>&1
            up_status=$?

            sleep 5
            (cd "$dir" && docker compose -p "$project" logs --no-color --tail=50) >> "$SUMMARY_FILE" 2>&1
            (cd "$dir" && docker compose -p "$project" down -v --remove-orphans) >> "$SUMMARY_FILE" 2>&1

            echo '```' >> "$SUMMARY_FILE"
            if [ $up_status -ne 0 ]; then
              echo "" >> "$SUMMARY_FILE"
              echo "**FALLÓ** \`docker compose up\` (código $up_status)" >> "$SUMMARY_FILE"
              OVERALL_STATUS=1
            fi
            echo "</details>" >> "$SUMMARY_FILE"
          done

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"
          exit $OVERALL_STATUS

      - name: Publicar log en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = "${{ steps.devrun.outputs.summary_file }}";
            let body = "No se generó resumen del dev-run.";
            if (path && fs.existsSync(path)) {
              body = fs.readFileSync(path, "utf8");
              if (body.length > 60000) {
                body = body.slice(0, 60000) + "\n\n...(truncado)";
              }
            }
            const marker = "<!-- dev-run-efimero -->";
            body = marker + "\n" + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
